# APK yig'ish: har push'da (yoki Actions sahifasida "Run workflow" tugmasi bilan).
# Natija: Actions -> oxirgi ishga tushirish -> Artifacts -> "ipak-yoli-apk".
name: Android APK

on:
  push:
    branches: [main, ipak-yoli-apk]
  workflow_dispatch:

permissions:
  contents: write # APK'ni Release'ga joylash uchun

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: O'rnatish
        run: npm ci

      - name: Unit testlar (sinovdan o'tmagan narsa APK bo'lmaydi)
        run: npx vitest run

      - name: Veb qism
        run: npm run build

      - name: Android loyihaga ko'chirish
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: APK yig'ish (debug imzo bilan — sinov uchun)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ipak-yoli-sarguzashti.apk

      - name: APK tekshiruvi (paket, versiya, imzo)
        shell: bash
        run: |
          set +e +o pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "Avtomatik yig'ilgan sinov APK (debug imzo). Commit: ${GITHUB_SHA::7}"
            echo
            echo '```'
            echo "build-tools: $(basename "$BT")"
            "$BT/aapt2" dump badging ipak-yoli-sarguzashti.apk 2>&1 | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable)"
            "$BT/apksigner" verify -v ipak-yoli-sarguzashti.apk 2>&1 | head -6
            echo "audio fayllar: $(unzip -l ipak-yoli-sarguzashti.apk | grep -c 'audio/uz/.*mp3')"
            echo "rasm fayllar: $(unzip -l ipak-yoli-sarguzashti.apk | grep -c 'public/img/.*webp')"
            echo "hajm: $(stat -c %s ipak-yoli-sarguzashti.apk) bayt"
            echo '```'
          } > notes.md
          cat notes.md
          exit 0

      - name: Release'ga joylash (telefondan to'g'ridan-to'g'ri yuklab olish uchun)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipak-yoli-apk-latest
          name: "Ipak Yo'li sarguzashti — sinov APK"
          prerelease: true
          make_latest: false
          body_path: notes.md
          files: ipak-yoli-sarguzashti.apk
          target_commitish: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: ipak-yoli-apk
          path: ipak-yoli-sarguzashti.apk
          retention-days: 30
