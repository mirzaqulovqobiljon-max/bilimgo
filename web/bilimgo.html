<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58CC02">
<title>BilimGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58CC02;--green-d:#46A302;--green-l:#D7FFB8;
  --blue:#1CB0F6;--blue-d:#1899D6;--blue-l:#DDF4FF;
  --red:#FF4B4B;--red-d:#EA2B2B;--red-l:#FFDFE0;
  --yellow:#FFC800;--yellow-d:#E5A500;--orange:#FF9600;
  --text:#3C3C3C;--muted:#777;--line:#E5E5E5;--soft:#F7F7F7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#fff;color:var(--text);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700}
body{overscroll-behavior-y:none}
button{font-family:inherit;color:inherit}
input,textarea{font-family:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:#fff}
h1,h2,h3{margin:0;font-weight:900}
.muted{color:var(--muted);font-weight:700}

/* ---- Buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:16px;
  padding:15px 18px;font-size:16px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{background:#E5E5E5;color:#AFAFAF;box-shadow:0 4px 0 #CFCFCF;cursor:default;transform:none}
.row{display:flex;gap:12px}.row>*{flex:1}
.row.c{justify-content:center}.row.c>*{flex:0 0 auto}

/* ---- Top bar & home ---- */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--green)}
.brand .flag{font-size:22px}
.pills{display:flex;gap:14px}
.pill{display:flex;align-items:center;gap:4px;font-weight:900;font-size:16px}
.pill.fire{color:var(--orange)}.pill.xp{color:var(--blue)}.pill.star{color:var(--yellow-d)}
.pill.off{color:#AFAFAF;filter:grayscale(1)}
.page{padding:16px 16px 110px}
.goal-card{border:2px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;gap:14px;align-items:center;margin-bottom:22px}
.goal-card .gi{font-size:36px}
.goal-card .gb{flex:1}
.goal-card .gt{display:flex;justify-content:space-between;font-size:15px;margin-bottom:8px}
.lvl-chip{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900;margin-top:8px}
.prog{height:16px;border-radius:10px;background:var(--line);overflow:hidden}
.prog>div{height:100%;border-radius:10px;background:var(--yellow);transition:width .5s cubic-bezier(.2,.8,.2,1);position:relative}
.prog>div::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.prog.green>div{background:var(--green)}
.prog.blue>div{background:var(--blue)}

.unit{margin-bottom:34px}
.ubanner{background:var(--uc);border-radius:20px;color:#fff;padding:16px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 var(--ucd)}
.ubanner .ut{flex:1;min-width:0}
.ubanner small{opacity:.85;font-weight:900;letter-spacing:.8px;font-size:12px}
.ubanner h2{font-size:20px;margin:2px 0}
.ubanner p{margin:0;font-size:14px;opacity:.95}
.ubanner .vocab{border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;border-radius:14px;padding:10px 12px;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap}
.ubanner .vocab:active{transform:translateY(2px)}
.unit.locked .ubanner{background:#AFAFAF;box-shadow:0 5px 0 #8f8f8f}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:62px 0 6px;position:relative}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:76px;height:70px;border-radius:50%;border:none;background:var(--uc);box-shadow:0 7px 0 var(--ucd);
  font-size:30px;color:#fff;cursor:pointer;position:relative;transition:transform .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ucd)}
.node.locked{background:#E5E5E5;box-shadow:0 7px 0 #CECECE;color:#AFAFAF;font-size:26px}
.node.done{background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d)}
.node.current::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--uc);opacity:.35;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.startlbl{position:absolute;top:-44px;background:#fff;border:2px solid var(--line);color:var(--uc);font-weight:900;font-size:14px;
  padding:7px 12px;border-radius:12px;animation:bob 1.2s ease-in-out infinite;white-space:nowrap;z-index:2;letter-spacing:.5px}
.startlbl::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.nstars{margin-top:12px;font-size:14px;letter-spacing:1px;color:var(--yellow-d);height:16px}
.nstars .off{color:#D0D0D0}
.side-mascot{position:absolute;top:70px;width:110px;opacity:.95;pointer-events:none}
.side-mascot.l{left:6px}.side-mascot.r{right:6px}

/* ---- Nav ---- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:2px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;border:2px solid transparent;background:none;border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button span{font-size:24px}
.nav button small{font-size:11px;font-weight:900;color:#AFAFAF;letter-spacing:.3px}
.nav button.on{border-color:#84D8FF;background:var(--blue-l)}
.nav button.on small{color:var(--blue-d)}

/* ---- Sheets / overlay / toast ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.overlay.show{opacity:1}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
.overlay.show .sheet{transform:none}
.sheet h3{font-size:21px;margin-bottom:8px}
.sheet p{margin:0 0 18px;color:var(--muted);line-height:1.45}
.ns-top{background:var(--uc);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.ns-top small{font-weight:900;opacity:.85;letter-spacing:.8px}
.ns-top h3{margin:4px 0 0;color:#fff}
.ns .btn{background:var(--uc);box-shadow:0 4px 0 var(--ucd);margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#3C3C3C;color:#fff;padding:12px 18px;border-radius:14px;z-index:200;
  font-weight:800;opacity:0;transition:all .25s;max-width:90vw;text-align:center;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.vlist{display:flex;flex-direction:column;gap:8px;margin:12px 0 18px}
.vrow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.vrow .ve{font-size:26px;width:34px;text-align:center}
.vrow .vt{flex:1;min-width:0}
.vrow .vt b{display:block;font-size:16px}
.vrow .vt small{color:var(--muted);font-size:14px}
.sh-h{font-size:20px;font-weight:900;color:var(--uc)}

/* ---- Speaker buttons ---- */
.spk{width:52px;height:52px;border-radius:14px;border:none;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);font-size:24px;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.spk.slow{background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.spk.sm{width:40px;height:40px;font-size:18px;border-radius:12px}
.spk.xl{width:120px;height:110px;font-size:52px;border-radius:26px;box-shadow:0 6px 0 var(--blue-d)}
.spk.pulse{animation:pulse .4s}
@keyframes pulse{50%{transform:scale(1.12)}}

/* ---- Lesson ---- */
.lesson{display:flex;flex-direction:column;height:100vh;height:100dvh}
.lhead{display:flex;align-items:center;gap:14px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
.x{border:none;background:none;font-size:26px;color:#AFAFAF;cursor:pointer;padding:4px 6px;font-weight:900}
.pbar{flex:1;height:18px;background:var(--line);border-radius:10px;overflow:hidden}
#bar{height:100%;width:0;background:var(--green);border-radius:10px;transition:width .4s cubic-bezier(.2,.8,.2,1);position:relative}
#bar::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:5px;border-radius:4px;background:rgba(255,255,255,.35)}
.combo{min-width:34px;text-align:right;font-weight:900;color:var(--orange);font-size:15px;white-space:nowrap}
.lbody{flex:1;overflow:auto;padding:6px 18px 24px}
.lbody.enter{animation:enter .3s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.lfoot{border-top:2px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom));transition:background .2s}
.lfoot.ok{background:var(--green-l);border-color:var(--green-l)}
.lfoot.bad{background:var(--red-l);border-color:var(--red-l)}
.fb{margin-bottom:14px;animation:enter .25s}
.fbh{font-size:21px;font-weight:900}
.lfoot.ok .fbh{color:var(--green-d)}.lfoot.bad .fbh{color:var(--red-d)}
.fbt{margin-top:6px;color:var(--red-d);font-weight:900}
.fba{color:var(--red-d);font-size:17px}
.lfoot.ok .fba{color:var(--green-d)}
.fbn{margin-top:8px;font-size:15px;line-height:1.45;color:#5b3a3a;font-weight:700}
.lfoot.ok .fbn{color:#2f5c0c}
.qh{font-size:22px;margin:8px 0 18px;line-height:1.3}
.tag{display:inline-block;font-weight:900;color:var(--blue-d);background:var(--blue-l);border-radius:10px;padding:5px 10px;font-size:13px;letter-spacing:.5px;margin:6px 0 12px}
.card{border:2px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 4px 0 var(--line)}
.learn{text-align:center}
.emoji-xl{font-size:84px;line-height:1.1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.learn .en{font-size:32px;font-weight:900;margin:8px 0 12px;color:var(--text)}
.learn .uz{font-size:20px;color:var(--muted);margin-top:14px}
.big-letter{font-size:96px;font-weight:900;color:var(--green);line-height:1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.read{font-size:26px;color:var(--blue-d);margin:6px 0 14px;font-weight:900}
.wordex{display:flex;align-items:center;gap:12px;margin-top:18px;background:var(--soft);border-radius:16px;padding:10px 12px;text-align:left}
.wordex .em{font-size:40px}
.wordex .wx{flex:1}
.wordex b{display:block;font-size:20px}
.wordex small{color:var(--muted);font-size:15px}
.note{margin-top:16px;background:#FFF7D6;border:2px solid #FFE58F;border-radius:16px;padding:12px 14px;text-align:left;font-size:15px;line-height:1.5;color:#6b5400}
.wchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.rule h2{font-size:22px;margin:6px 0 8px;text-align:center}
.rule p{font-size:16px;line-height:1.55;margin:0 0 14px}
.remoji{font-size:54px;text-align:center}
.ex{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:8px 10px;margin-top:8px}
.ex b{display:block;font-size:17px}.ex span{color:var(--muted);font-size:14px}
.mrow{display:flex;align-items:flex-start;gap:10px;margin:4px 0 18px}
.mrow svg{flex:0 0 auto}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.4;flex:1;margin-top:10px}
.bubble::before{content:"";position:absolute;left:-8px;top:20px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .bq{display:flex;align-items:center;gap:10px}
.bubble small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.prompt{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.prompt .pe{font-size:56px}
.prompt .pt{font-size:26px;font-weight:900}
.prompt.center{justify-content:center}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:16px 12px;font-size:18px;font-weight:800;cursor:pointer;
  box-shadow:0 4px 0 var(--line);text-align:center;transition:transform .08s;line-height:1.3;min-height:58px}
.opt:active{transform:translateY(2px)}
.opt.sel{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d);box-shadow:0 4px 0 #84D8FF}
.opt.right{border-color:#A5ED6E;background:var(--green-l);color:var(--green-d);box-shadow:0 4px 0 #A5ED6E}
.opt.wrong{border-color:#FFB2B2;background:var(--red-l);color:var(--red-d);box-shadow:0 4px 0 #FFB2B2;animation:shake .35s}
.opt.gone{opacity:.35;pointer-events:none;transform:scale(.97)}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fill-q{font-size:24px;font-weight:900;line-height:1.5}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue-d)}
.sub-uz{color:var(--muted);font-size:16px;margin-top:6px}
.ansline{min-height:116px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);
  background:repeating-linear-gradient(transparent 0 56px,var(--line) 56px 58px);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start;margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line);animation:pop .2s}
.tile.used{background:var(--line);color:transparent;box-shadow:none;pointer-events:none}
.tin{padding:12px;width:100%;border:2px solid var(--line);background:var(--soft);border-radius:16px;font-size:20px;font-weight:800;outline:none;resize:none;color:var(--text)}
.tin:focus{border-color:#84D8FF;background:#fff}
.hint{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:12px;padding:6px 10px;font-size:14px;margin-bottom:12px;cursor:pointer;border:none;font-weight:800}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:12px}
.match .opt{font-size:17px;padding:14px 8px}
.dlg{display:flex;flex-direction:column;gap:12px;text-align:left}
.msg{display:flex;align-items:center;gap:10px;border-radius:18px;padding:10px 12px}
.msg.a{background:var(--blue-l);margin-right:30px}
.msg.b{background:var(--green-l);margin-left:30px}
.msg .who{font-size:28px}
.msg div{flex:1}
.msg b{display:block;font-size:18px}
.msg small{color:var(--muted);font-size:14px}

/* ---- Result ---- */
.result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 18px calc(24px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
.result h1{font-size:28px;color:var(--yellow-d);margin-top:8px}
.result.fail h1{color:var(--red-d)}
.result .muted{margin:8px 0 0}
.stars.big{font-size:46px;margin:14px 0 6px;letter-spacing:4px}
.stars span{display:inline-block;color:#E0E0E0}
.stars span.on{color:var(--yellow);animation:starpop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:16px 0}
.rs{border:2px solid var(--c);border-radius:16px;overflow:hidden}
.rs small{display:block;background:var(--c);color:#fff;font-weight:900;font-size:12px;padding:4px;letter-spacing:.5px}
.rs b{display:block;padding:12px 4px;font-size:18px;color:var(--c)}
.rs.y{--c:var(--yellow-d)}.rs.g{--c:var(--green)}.rs.b{--c:var(--blue)}
.rbox{width:100%;border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;margin-bottom:10px;font-size:15px}
.rbox h4{margin:0 0 8px;font-size:15px}
.rbtns{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.badge-new{display:flex;align-items:center;gap:10px;margin-top:6px}
.badge-new span{font-size:28px}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:300}

/* ---- Board / badges / profile ---- */
.ptitle{font-size:24px;margin:4px 0 6px}
.league{text-align:center;padding:8px 0 14px}
.league .li{font-size:64px}
.info{background:var(--blue-l);color:#0f6c99;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;margin-bottom:14px}
.lb{display:flex;flex-direction:column}
.lbr{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px}
.lbr.me{background:var(--green-l)}
.lbr .rk{width:28px;text-align:center;font-weight:900;color:var(--muted)}
.lbr .rk.top{color:var(--green-d)}
.lbr .av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px}
.lbr .nm{flex:1;font-weight:800}
.lbr .px{font-weight:900;color:var(--muted)}
.zone{font-size:12px;font-weight:900;color:var(--green-d);text-align:center;padding:6px;border-top:2px dashed #A5ED6E;margin:4px 0;letter-spacing:.5px}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bdg{border:2px solid var(--line);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 3px 0 var(--line)}
.bdg .bi{font-size:42px}
.bdg b{display:block;margin-top:6px}
.bdg small{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.3}
.bdg.off .bi{filter:grayscale(1);opacity:.35}
.bdg.on{border-color:#FFE58F;background:#FFFBEA}
.phead{display:flex;align-items:center;gap:16px;margin:6px 0 18px}
.phead .pav{width:84px;height:84px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;font-size:50px;border:3px solid var(--green)}
.phead h2{font-size:24px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sg{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px}
.sg .si{font-size:26px}
.sg b{display:block;font-size:19px}
.sg small{color:var(--muted);font-size:12px}
.sec{font-size:19px;margin:22px 0 10px}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;border:2px solid var(--line);border-radius:16px;padding:12px 10px 8px}
.chart .cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .cb i{display:block;width:100%;max-width:30px;background:var(--blue);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s}
.chart .cb.today i{background:var(--green)}
.chart .cb small{font-size:11px;color:var(--muted)}
.chart .cb em{font-style:normal;font-size:11px;color:var(--text)}
.set{border:2px solid var(--line);border-radius:18px;overflow:hidden}
.setr{padding:14px;border-bottom:2px solid var(--line)}
.setr:last-child{border-bottom:none}
.setr .sl{font-weight:900;margin-bottom:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-weight:900;cursor:pointer;font-size:14px}
.seg button.on{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d)}
.sw{display:flex;align-items:center;justify-content:space-between}
.tog{width:56px;height:32px;border-radius:20px;background:var(--line);border:none;position:relative;cursor:pointer;transition:background .2s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--green)}.tog.on::after{left:28px}
.linkbtn{width:100%;text-align:left;background:none;border:none;padding:14px;font-size:16px;font-weight:800;cursor:pointer;border-bottom:2px solid var(--line)}
.linkbtn:last-child{border-bottom:none}
.linkbtn.danger{color:var(--red-d)}

/* ---- Onboarding ---- */
.ob{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.ob .obh{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ob .obb{flex:1}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.welcome h1{font-size:40px;color:var(--green);letter-spacing:-.5px}
.welcome p{font-size:18px;color:var(--muted);margin:0;max-width:320px;line-height:1.45}
.mascot{animation:bob 2.2s ease-in-out infinite}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.avgrid button{aspect-ratio:1;font-size:40px;border:2px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.avgrid button.on{border-color:#84D8FF;background:var(--blue-l);box-shadow:0 3px 0 #84D8FF}
.glist{display:flex;flex-direction:column;gap:10px}
.glist button{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);border-radius:16px;background:#fff;padding:16px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.glist button.on{border-color:#84D8FF;background:var(--blue-l);color:var(--blue-d);box-shadow:0 3px 0 #84D8FF}
.glist small{color:var(--muted);font-weight:700}
.grow{flex:1}
.glist button.ptest{border-color:#A5ED6E;background:var(--green-l);box-shadow:0 3px 0 #A5ED6E;text-align:left}
.glist button.ptest.on{border-color:#84D8FF;background:var(--blue-l);box-shadow:0 3px 0 #84D8FF}
.glist button span{text-align:left;line-height:1.3}
.glist .or{text-align:center;color:var(--muted);font-size:13px;font-weight:900;letter-spacing:.6px;margin:4px 0}
.place-card{display:flex;flex-direction:column;gap:12px;border:2px solid #84D8FF;background:var(--blue-l);border-radius:20px;padding:14px 16px;margin-bottom:22px}
.place-card .pt{display:flex;gap:12px;align-items:center}
.place-card .pi{font-size:36px}
.place-card b{display:block;font-size:17px;color:#0f6c99}
.place-card small{display:block;color:#0f6c99;font-size:14px;font-weight:700;margin-top:2px;line-height:1.35}
.btn.sm{padding:12px 10px;font-size:14px;letter-spacing:.3px}
.lvl-result{border:2px solid #84D8FF;background:var(--blue-l);border-radius:18px;padding:12px 16px;margin-top:16px;width:100%}
.lvl-result small{display:block;color:#0f6c99;font-weight:900;font-size:12px;letter-spacing:.8px}
.lvl-result b{display:block;font-size:24px;color:var(--blue-d);margin-top:2px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:521px){#app{box-shadow:0 0 0 2px var(--line)}}

});

});

        setTimeout(() => [a, c].forEach(x => { x.classList.remove('right'); x.classList.add('gone'); }), 350);
        if (done === st.pairs.length) {
          L.phase = 'done';
          if (!st.retry) { L.graded++; if (!mist) L.firstOk++; }
          L.passed++; L.mistakes += mist; if (!mist) L.combo++; else L.combo = 0;
          updateHead();
          const f = $('#lfoot'); f.className = 'lfoot ok';
          f.innerHTML = `<div class="fb"><div class="fbh">✅ ${mist ? 'Barcha juftliklar topildi!' : pick(PRAISE)}</div>${mist ? `<div class="fbn">${mist} ta xato bo‘ldi — so‘zlarni lug‘atdan takrorlab oling.</div>` : ''}</div>
            <button class="btn" id="mainBtn">Davom etish</button>`;
          $('#mainBtn').onclick = next;
        }
      } else {
        mist++; SFX.bad();
        [a, c].forEach(x => { x.classList.remove('sel'); x.classList.add('wrong'); });
        setTimeout(() => [a, c].forEach(x => x.classList.remove('wrong')), 450);
      }
    }
  });
};

/* ---------- Javobni tekshirish ---------- */
const CHECK = {};
const mcCheck = st => {
  const it = st.item, ok = L.answer === st.ans;
  $$('#lbody .opt').forEach(x => {
    const v = x.textContent;
    if (v === st.ans) x.classList.add('right'); else if (v === L.answer) x.classList.add('wrong');
    x.classList.remove('sel');
  });
  const r = {ok, correct: st.ans, note: ok ? '' : it.note};
  if (['listen', 'listen_mc', 'listen_uz'].includes(st.type)) { r.extra = `${it.en} — ${it.uz}`; if (!ok) r.correct = r.extra; }
  if (st.type === 'mc_uz2en' || st.type === 'fill' || st.type === 'reply') r.say = st.type === 'fill' ? it.en : st.ans;
  if (st.type === 'fill' && ok) r.extra = it.en;
  if (st.type === 'fill' && !ok) r.correct = it.en;
  return r;
};
['mc_en2uz', 'mc_uz2en', 'listen', 'listen_mc', 'listen_uz', 'fill', 'reply'].forEach(t => CHECK[t] = mcCheck);
const typeCheck = st => {
  const it = st.item, u = expand(norm(L.answer || '')), n = expand(norm(st.ans));
  if (u === n) return {ok: true, say: it.en, extra: st.type === 'dictation' ? `${it.en} — ${it.uz}` : ''};
  const d = lev(u, n), allow = n.length >= 12 ? 2 : n.length >= 4 ? 1 : 0;
  if (d <= allow) return {ok: true, title: 'To‘g‘ri, lekin kichik xato bor', extra: `To‘g‘ri yozilishi: ${it.en}`, say: it.en};
  return {ok: false, correct: st.type === 'dictation' ? `${it.en} — ${it.uz}` : it.en, note: it.note};
};
CHECK.type = typeCheck; CHECK.dictation = typeCheck;
CHECK.free = st => {
  const it = st.item, raw = String(L.answer || '').replace(/[’‘`ʼ]/g, "'").trim();
  if (!/[a-z]/i.test(raw)) return {ok: false, correct: it.sample, note: 'Javobni lotin harflarida, ingliz tilida yozing.'};
  if (it.re.test(raw)) return {ok: true, title: 'Ajoyib javob!', extra: `Namuna: ${it.sample}`};
  return {ok: false, correct: it.sample, note: it.note};
};
const buildCheck = st => {
  const it = st.item, got = L.chosen.map(k => st.tiles[k]).join(' ').toLowerCase(), want = st.ans.join(' ').toLowerCase();
  const ok = got === want;
  return {ok, correct: it.en, extra: ok ? it.uz : '', say: ok ? it.en : '', note: ok ? '' : (it.note || 'So‘zlar tartibiga e’tibor bering: KIM → NIMA QILADI → NIMANI.')};
};
CHECK.build = buildCheck; CHECK.listen_build = buildCheck;

/* ---------- Dars yakuni: XP, streak, yulduzlar ---------- */
function finishLesson() {
  const n = L.node, secs = Math.round((Date.now() - L.start) / 1000);
  const acc = L.graded ? Math.round(100 * L.firstOk / L.graded) : 100;
  let stars, pass = true, xp;
  if (L.test) {
    pass = acc >= 70; stars = acc >= 95 ? 3 : acc >= 85 ? 2 : acc >= 70 ? 1 : 0;
    xp = pass ? 20 + (stars === 3 ? 10 : 0) : 5;
  } else {
    stars = L.mistakes === 0 ? 3 : L.mistakes <= 2 ? 2 : 1; xp = 10 + (L.mistakes === 0 ? 5 : 0);
  }
  normalizeDay();
  const t = todayKey(); let streakUp = false, goalNow = false;
  S.xp += xp; S.today.xp += xp; S.week.xp += xp; S.history[t] = (S.history[t] || 0) + xp;
  Object.keys(S.history).forEach(k => { if (k < dayShift(-30)) delete S.history[k]; });
  if (pass && S.lastDay !== t) { S.streak = S.lastDay === dayShift(-1) ? S.streak + 1 : 1; S.lastDay = t; streakUp = true; }
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  if (!S.today.goalHit && S.today.xp >= S.dailyGoal) { S.today.goalHit = true; S.stats.goals++; goalNow = true; }
  const firstTime = !S.done[n.id];
  if (pass) {
    S.done[n.id] = {stars: Math.max(stars, S.done[n.id]?.stars || 0), at: t};
    S.stats.lessons++; if (L.mistakes === 0 && !L.test) S.stats.perfect++;
    if (L.test && firstTime) S.stats.tests++;
  }
  const newBadges = BADGES.filter(b => !S.badges.includes(b.id) && b.ok());
  newBadges.forEach(b => S.badges.push(b.id));
  save();
  renderResult({n, pass, stars, xp, acc, secs, streakUp, goalNow, newBadges, missed: [...L.missed.values()], test: L.test});
  L = null;
}
function renderResult(r) {
  const mm = `${Math.floor(r.secs / 60)}:${String(r.secs % 60).padStart(2, '0')}`;
  const title = !r.pass ? 'Biroz yetmadi!' : r.test ? 'Test topshirildi!' : r.stars === 3 ? 'Mukammal dars!' : 'Dars tugadi!';
  const sub = !r.pass ? `Testdan o‘tish uchun 70% kerak. Sizda ${r.acc}%. Xatolarni takrorlab, yana urinib ko‘ring — siz albatta uddalaysiz!`
    : r.test ? `«${r.n.unit.title}» bo‘limini muvaffaqiyatli tugatdingiz!` : 'Bilimjon siz bilan faxrlanadi!';
  let extras = '';
  if (r.streakUp) extras += `<div class="rbox">🔥 <b>${S.streak} kun</b> ketma-ket o‘qiyapsiz!</div>`;
  if (r.goalNow) extras += `<div class="rbox">🎯 <b>Kunlik maqsad bajarildi!</b> (${S.dailyGoal} XP)</div>`;
  if (r.newBadges.length) extras += `<div class="rbox"><h4>🏅 Yangi mukofot!</h4>${r.newBadges.map(b => `<div class="badge-new"><span>${b.icon}</span><div><b>${esc(b.name)}</b><br><small class="muted">${esc(b.desc)}</small></div></div>`).join('')}</div>`;
  if (r.missed.length) extras += `<div class="rbox"><h4>📝 Takrorlash kerak:</h4>${r.missed.slice(0, 6).map(it => `<div class="vrow" style="margin-top:6px"><span class="ve">${it.emoji || '💬'}</span><div class="vt"><b>${esc(it.en || it.q)}</b><small>${esc(it.uz)}</small></div>${spk(sayOf(it), 'sm')}</div>`).join('')}</div>`;
  app.innerHTML = `<div class="result ${r.pass ? '' : 'fail'}">${mascot(r.pass ? 'happy' : 'sad', 130)}<h1>${title}</h1><p class="muted">${esc(sub)}</p>
    <div class="stars big">${starsHtml(r.stars)}</div>
    <div class="rstats"><div class="rs y"><small>XP</small><b>⚡ +${r.xp}</b></div><div class="rs g"><small>ANIQLIK</small><b>🎯 ${r.acc}%</b></div><div class="rs b"><small>VAQT</small><b>⏱️ ${mm}</b></div></div>
    ${extras}<div class="rbtns">${r.pass ? '' : '<button class="btn ghost" id="retry">Qayta urinish</button>'}<button class="btn" id="cont">Davom etish</button></div></div>`;
  if (r.pass) { setTimeout(confetti, 150); SFX.win(); } else SFX.bad();
  $('#cont').onclick = () => { renderHome.scrolled = false; show('home'); };
  const rt = $('#retry'); if (rt) rt.onclick = () => startLesson(r.n);
}

/* ---------- Reyting ---------- */
const BOTS = [['Madina', '🦊'], ['Jasur', '🐯'], ['Sevara', '🐰'], ['Bekzod', '🦁'], ['Dilnoza', '🐼'], ['Sardor', '🐸'], ['Malika', '🐨'], ['Otabek', '🐵'], ['Nilufar', '🦄']];

    <div class="lb">${list.map((p, i) => `${i === 3 ? '<div class="zone">▲ KEYINGI LIGAGA KO‘TARILISH ZONASI ▲</div>' : ''}
      <div class="lbr ${p.me ? 'me' : ''}"><div class="rk ${i < 3 ? 'top' : ''}">${i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}</div><div class="av">${p.av}</div>
      <div class="nm">${esc(p.name)}${p.me ? ' (siz)' : ''}</div><div class="px">${p.xp} XP</div></div>`).join('')}</div></main>` + navBar();
}

}

/* ---------- Profil va sozlamalar ---------- */
const WD = ['Du', 'Se', 'Ch', 'Pa', 'Ju', 'Sh', 'Ya'];
function renderProfile() {
  const lv = levelInfo(S.xp), p = S.profile;
  const days = Array.from({length: 7}, (_, i) => { const k = dayShift(i - 6), d = new Date(); d.setDate(d.getDate() + i - 6); return {k, xp: S.history[k] || 0, wd: WD[(d.getDay() + 6) % 7], today: i === 6}; });
  const mx = Math.max(S.dailyGoal, ...days.map(d => d.xp));
  const done = Object.keys(S.done).filter(k => !k.endsWith('t') && !S.done[k].placed).length;
  app.innerHTML = topBar() + `<main class="page">
    <div class="phead"><div class="pav">${p.avatar}</div><div><h2>${esc(p.name)}</h2><div class="muted">${p.created} dan beri o‘qiydi</div></div></div>
    <div class="sgrid">
      <div class="sg"><span class="si">🔥</span><div><b>${S.streak}</b><small>Ketma-ket kun</small></div></div>
      <div class="sg"><span class="si">⚡</span><div><b>${S.xp}</b><small>Jami XP</small></div></div>
      <div class="sg"><span class="si">📚</span><div><b>${done}</b><small>Tugatilgan dars</small></div></div>
      <div class="sg"><span class="si">⭐</span><div><b>${totalStars()}</b><small>Yulduzlar</small></div></div>
      <div class="sg"><span class="si">🏆</span><div><b>${S.bestStreak}</b><small>Eng uzun seriya</small></div></div>
      <div class="sg"><span class="si">🎓</span><div><b>${S.stats.tests}/${UNITS.length}</b><small>Bo‘lim testlari</small></div></div></div>
    <h3 class="sec">${lv.lvl}-daraja · ${lv.name}</h3>
    <div class="prog blue"><div style="width:${lv.max ? 100 : Math.round(100 * lv.cur / lv.need)}%"></div></div>
    <div class="muted" style="margin-top:6px;font-size:14px">${lv.max ? 'Eng yuqori daraja!' : `Keyingi darajaga ${lv.need - lv.cur} XP qoldi`}</div>
    <h3 class="sec">So‘nggi 7 kun</h3>
    <div class="chart">${days.map(d => `<div class="cb ${d.today ? 'today' : ''}"><em>${d.xp || ''}</em><i style="height:${Math.round(85 * d.xp / mx)}%"></i><small>${d.wd}</small></div>`).join('')}</div>
    <h3 class="sec">Sozlamalar</h3>
    <div class="set">
      <div class="setr"><div class="sl">🎯 Kunlik maqsad</div><div class="seg" id="goalSeg">${[10, 20, 30, 50].map(g => `<button class="${S.dailyGoal === g ? 'on' : ''}" data-g="${g}">${g} XP</button>`).join('')}</div></div>
      <div class="setr"><div class="sl">🗣️ Talaffuz tezligi</div><div class="seg" id="rateSeg">${[[0.6, 'Sekin'], [0.85, 'O‘rtacha'], [1, 'Tabiiy']].map(([v, l]) => `<button class="${S.settings.rate === v ? 'on' : ''}" data-r="${v}">${l}</button>`).join('')}</div>
        <button class="btn blue" style="margin-top:12px" id="testVoice">🔊 Ovozni sinash</button></div>
      <div class="setr sw"><div class="sl" style="margin:0">🔔 Ovoz effektlari</div><button class="tog ${S.settings.sfx ? 'on' : ''}" id="sfxTog" aria-label="Ovoz effektlari"></button></div>
    </div>
    <div class="set" style="margin-top:14px">
      <button class="linkbtn" id="placeTest">🎯 Darajani aniqlash testi</button>
      <button class="linkbtn" id="placeChoose">📶 Darajani o‘zim tanlayman</button>
      <button class="linkbtn" id="editName">✏️ Ism va qahramonni o‘zgartirish</button>
      <button class="linkbtn danger" id="reset">🗑️ Barcha progressni o‘chirish</button></div>
    <p class="muted" style="text-align:center;font-size:12px;margin-top:20px">BilimGo · prototip v0.1 · ma’lumotlar faqat shu qurilmada saqlanadi</p>
  </main>` + navBar();
  $$('#goalSeg button').forEach(b => b.onclick = () => { S.dailyGoal = +b.dataset.g; if (S.today.xp < S.dailyGoal) S.today.goalHit = false; save(); renderProfile(); toast('Kunlik maqsad: ' + S.dailyGoal + ' XP'); });
  $$('#rateSeg button').forEach(b => b.onclick = () => { S.settings.rate = +b.dataset.r; save(); renderProfile(); speak('Hello! I am Bilimjon.'); });
  $('#testVoice').onclick = () => speak('Hello! Welcome to BilimGo. Let us learn English!');
  $('#sfxTog').onclick = () => { S.settings.sfx = !S.settings.sfx; save(); renderProfile(); SFX.ok(); };
  $('#editName').onclick = editProfile;
  $('#placeTest').onclick = startPlacement;
  $('#placeChoose').onclick = levelSheet;
  $('#reset').onclick = async () => {
    if (await confirmBox('Progressni o‘chirasizmi?', 'Barcha XP, yulduzlar, mukofotlar va darslar o‘chib ketadi. Bu amalni ortga qaytarib bo‘lmaydi.', 'O‘chirish', true)) {
      store.clear(); loadState(); renderHome.scrolled = false; OB = {name: '', avatar: '🦁', goal: 20}; renderOnboard(0);
    }
  };
}
const AVATARS = ['🦁', '🐯', '🐼', '🦊', '🐸', '🐨', '🐰', '🐵', '🦄', '🐧', '🐶', '🐱'];
function editProfile() {
  let av = S.profile.avatar;
  sheet(`<h3>Profilni tahrirlash</h3><input class="tin" id="nm" maxlength="20" value="${esc(S.profile.name)}" style="margin:8px 0 14px">
    <div class="avgrid" id="avg">${AVATARS.map(a => `<button class="${a === av ? 'on' : ''}" data-a="${a}">${a}</button>`).join('')}</div>
    <button class="btn" id="saveP" style="margin-top:16px">Saqlash</button>`, (o, close) => {
    $$('#avg button', o).forEach(b => b.onclick = () => { av = b.dataset.a; $$('#avg button', o).forEach(x => x.classList.toggle('on', x === b)); });
    $('#saveP', o).onclick = () => {
      const nm = $('#nm', o).value.trim();
      if (nm.length < 2) { toast('Ism kamida 2 ta harfdan iborat bo‘lsin'); return; }

  });
}

/* ---------- Ro‘yxatdan o‘tish (onboarding) ---------- */
let OB = {name: '', avatar: '🦁', goal: 20, level: 'test'};
function renderOnboard(step) {
  tab = 'home';
  if (step === 0) {
    app.innerHTML = `<div class="ob"><div class="welcome">${mascot('happy', 170)}<h1>BilimGo</h1>
      <p>Salom! Men <b style="color:var(--green)">Bilimjon</b>man. Keling, ingliz tilini birga, noldan va o‘yin orqali o‘rganamiz!</p></div>
      <button class="btn" id="n0">Boshlash</button></div>`;
    $('#n0').onclick = () => { SFX.tap(); speak('Hello!'); renderOnboard(1); };
    return;
  }
  const bar = `<div class="obh"><button class="x" id="back" aria-label="Orqaga">←</button><div class="obb"><div class="prog green"><div style="width:${step * 25}%"></div></div></div></div>`;
  let body = '', valid = true;
  if (step === 1) {
    body = `<div class="mrow">${mascot('happy', 90)}<div class="bubble">Ismingiz nima? Sizni qanday chaqiray?</div></div>
      <input class="tin" id="nm" maxlength="20" placeholder="Masalan: Aziz" value="${esc(OB.name)}" autocomplete="given-name">`;
    valid = OB.name.trim().length >= 2;
  } else if (step === 2) {
    body = `<div class="mrow">${mascot('wow', 90)}<div class="bubble">${esc(OB.name)}, o‘zingizga qahramon tanlang!</div></div>
      <div class="avgrid">${AVATARS.map(a => `<button class="${a === OB.avatar ? 'on' : ''}" data-a="${a}" aria-label="${a}">${a}</button>`).join('')}</div>`;
  } else if (step === 4) {
    body = `<div class="mrow">${mascot('wow', 90)}<div class="bubble">Ingliz tilini qanchalik bilasiz?</div></div>
      <div class="glist"><button class="ptest ${OB.level === 'test' ? 'on' : ''}" data-lv="test"><span>🎯 Test orqali aniqlash<br><small>5–10 daqiqa · eng aniq yo‘l</small></span><small>Tavsiya</small></button>
      <div class="or">YOKI O‘ZINGIZ TANLANG</div>
      ${LEVEL_CHOICES.map(c => `<button class="${OB.level === c.unit ? 'on' : ''}" data-lv="${c.unit}"><span>${c.icon} ${esc(c.title)}<br><small>${esc(c.sub)}</small></span><small>${c.unit}-bo‘lim</small></button>`).join('')}</div>`;
  } else {
    body = `<div class="mrow">${mascot('happy', 90)}<div class="bubble">Kuniga qancha o‘qishni xohlaysiz?</div></div>
      <div class="glist">${[[10, 'Yengil', '~5 daqiqa'], [20, 'O‘rtacha', '~10 daqiqa'], [30, 'Jiddiy', '~15 daqiqa'], [50, 'Kuchli', '~25 daqiqa']]
        .map(([g, l, t]) => `<button class="${OB.goal === g ? 'on' : ''}" data-g="${g}"><span>${l}</span><small>${t} · ${g} XP</small></button>`).join('')}</div>`;
  }
  app.innerHTML = `<div class="ob">${bar}${body}<div class="grow"></div><button class="btn" id="nx" ${valid ? '' : 'disabled'} style="margin-top:20px">${step < 4 ? 'Davom etish' : OB.level === 'test' ? 'Testni boshlash' : 'O‘qishni boshlash'}</button></div>`;
  $('#back').onclick = () => renderOnboard(step - 1);
  if (step === 1) {
    const nm = $('#nm');
    nm.oninput = () => { OB.name = nm.value; $('#nx').disabled = OB.name.trim().length < 2; };
    nm.onkeydown = e => { if (e.key === 'Enter' && !$('#nx').disabled) $('#nx').click(); };
    setTimeout(() => nm.focus(), 100);
  }
  $$('[data-a]').forEach(b => b.onclick = () => { OB.avatar = b.dataset.a; SFX.tap(); $$('[data-a]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-g]').forEach(b => b.onclick = () => { OB.goal = +b.dataset.g; SFX.tap(); $$('[data-g]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-lv]').forEach(b => b.onclick = () => {
    OB.level = b.dataset.lv === 'test' ? 'test' : +b.dataset.lv; SFX.tap();
    $$('[data-lv]').forEach(x => x.classList.toggle('on', x === b));
    $('#nx').textContent = OB.level === 'test' ? 'Testni boshlash' : 'O‘qishni boshlash';
  });
  $('#nx').onclick = () => {
    if (step < 4) return renderOnboard(step + 1);
    S.profile = {name: OB.name.trim().slice(0, 20), avatar: OB.avatar, created: todayKey()};
    S.dailyGoal = OB.goal; save(); SFX.win();
    renderHome.scrolled = false;
    if (OB.level === 'test') return startPlacement();
    applyStart(OB.level, 'choice');
    show('home'); toast(`Xush kelibsiz, ${S.profile.name}! 🎉`);
  };
}
